<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trade Orbit | Live Crypto Dashboard</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Header -->
  <header>

    <h1>🚀 Trade Orbit</h1>

    <p class="tagline">
      Live Cryptocurrency Market Dashboard
    </p>

    <input
      type="text"
      id="search"
      placeholder="🔍 Search Coin..."
    >

  </header>
  <div class="market-overview">

  <div class="overview-card">
    <h3>📈 Top Gainer</h3>
    <p id="top-gainer">Loading...</p>
  </div>

  <div class="overview-card">
    <h3>📉 Top Loser</h3>
    <p id="top-loser">Loading...</p>
  </div>

  <div class="overview-card">
    <h3>🪙 Total Coins</h3>
    <p id="total-coins">0</p>
  </div>

  </div>

  <!-- Coins -->
  <div class="crypto-container" id="crypto-container"></div>

  <!-- Last Update -->
  <div class="update-box">

    <p id="update-time">
      Last Updated : --
    </p>

  </div>
<!-- Coin Details Modal -->
<div id="coin-modal" class="coin-modal">

  <div class="coin-modal-content">

    <span class="close-btn" onclick="closeCoinDetails()">&times;</span>

    <h2 id="detail-name">Coin</h2>

    <p><strong>Price:</strong> <span id="detail-price">--</span></p>

    <p><strong>24H Change:</strong> <span id="detail-change">--</span></p>

    <p><strong>Market Cap:</strong> <span id="detail-marketcap">--</span></p>

    <p><strong>24H Volume:</strong> <span id="detail-volume">--</span></p>

    <p><strong>Rank:</strong> <span id="detail-rank">--</span></p>

    <hr>

    <div id="candlestick-chart" style="height:400px;">
      📊 Candlestick Chart Coming Soon...
    </div>

  </div>

</div>
  <!-- Footer -->
  <footer>
    <p>
      © 2026 Trade Orbit | Live Crypto Market
    </p>

  </footer>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <!-- JS Files -->
  <script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/search.js"></script>
<script src="js/market.js"></script>

<script src="js/indicators.js"></script>
<script src="js/chart.js"></script>

<script src="js/animation.js"></script>
<script src="js/details.js"></script>
<script src="js/patterns.js"></script>
<script src="js/app.js"></script>

</body>

</html>
